[package]
name = "watch-time-stats"
version = "0.1.0"
description = "Estimates how much time you have spent watching YouTube, from your Google Takeout watch history"
authors = ["jriiik"]
repository = "https://github.com/jriiik/youtube-hours-watched"
edition = "2021"
publish = false

[lib]
# The suffix keeps the library's output files from colliding with the binary's on Windows
# (rust-lang/cargo#8519). Only an rlib: this is a desktop app, and the staticlib/cdylib
# outputs Tauri's mobile targets need would each repeat the slow LTO step in CI.
name = "watch_time_stats_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Hands links to the default browser. ShellExecute rather than the crate's default of
# starting PowerShell, which is slower and blocked on some managed PCs.
open = { version = "5", features = ["shellexecute-on-windows"] }
# Already in the tree through tauri (tauri::Url is url::Url); named so links.rs can be
# tested without building the whole shell.
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
