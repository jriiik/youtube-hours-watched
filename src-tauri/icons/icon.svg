<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- App icon source art: a stopwatch with a bar chart for a face. Regenerate the icon set with
       npx tauri icon src-tauri/icons/icon.svg -o src-tauri/icons
       and delete the android and ios folders it adds (this is a desktop app). -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161C26"/>
      <stop offset="1" stop-color="#0B0E13"/>
    </linearGradient>
    <linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="0" y1="112" x2="0" y2="926">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="224" fill="url(#ground)"/>
  <rect x="20" y="20" width="984" height="984" rx="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="8"/>
  <g fill="url(#teal)">
    <rect x="432" y="112" width="160" height="64" rx="32"/>
    <rect x="484" y="160" width="56" height="80" rx="12"/>
    <rect x="763" y="243" width="56" height="100" rx="20" transform="rotate(45 791 293)"/>
    <rect x="352" y="569" width="80" height="165" rx="22"/>
    <rect x="472" y="434" width="80" height="300" rx="22"/>
    <rect x="592" y="518" width="80" height="216" rx="22"/>
  </g>
  <circle cx="512" cy="572" r="310" fill="none" stroke="url(#teal)" stroke-width="88"/>
</svg>
