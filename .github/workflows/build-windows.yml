name: Build Windows installers

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:
  # release.yml calls this workflow, so a release gets the same tests and build as every push.
  workflow_call:

# A newer push to the same branch makes a running build pointless. In a called workflow,
# github.workflow is the caller's name, so a release's build has a group of its own
# ("Publish a release-refs/heads/main") and no push can cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Third-party actions are pinned to a commit: they run where the installers are built.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Builds the web app (npm run build), compiles the Rust shell and makes both installers.
      - name: Build app and installers
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: Watch-Time-Stats-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
